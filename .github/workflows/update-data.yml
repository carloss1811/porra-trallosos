name: Actualizar datos de la porra

on:
  schedule:
    # cada 10 minutos durante el Mundial (GitHub puede retrasarlos unos minutos)
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar datos
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python scripts/update_data.py

      - name: Commit si hay cambios
        run: |
          git config user.name "porra-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Sin cambios" && exit 0
          git commit -m "data: actualización automática"
          git pull --rebase origin main
          git push
