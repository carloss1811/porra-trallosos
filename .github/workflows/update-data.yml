name: Actualizar datos de la porra

on:
  schedule:
    # GitHub retrasa mucho los crons programados (a veces más de una hora).
    # Para compensar, cada ejecución se queda en bucle ~75 min actualizando
    # cada ~9 min; cuando arranca la siguiente, cancela a la anterior.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar datos en bucle
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          git config user.name "porra-bot"
          git config user.email "actions@users.noreply.github.com"
          for i in $(seq 1 15); do
            echo "::group::Actualización $i/15"
            git pull --rebase origin main
            python scripts/update_data.py
            git add data/
            if git diff --cached --quiet; then
              echo "Sin cambios"
            else
              git commit -m "data: actualización automática"
              git push || { git pull --rebase origin main && git push; }
            fi
            echo "::endgroup::"
            [ "$i" -lt 15 ] && sleep 300 || true
          done
